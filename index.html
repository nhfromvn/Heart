<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haru &lt;3</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* ── Gift screen ── */
        #gift-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: linear-gradient(135deg, #ffd6e8 0%, #ffe8f5 30%, #e8d5ff 60%, #fff0f5 100%);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #gift-screen.hide {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .cute-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .cute-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(255,105,180,0.15) 2px, transparent 2px);
            background-size: 32px 32px;
        }
        .float-item {
            position: absolute;
            font-size: clamp(1.2rem, 3vw, 2rem);
            animation: floatUp linear infinite;
            opacity: 0.7;
        }
        .float-item.sparkle {
            animation: floatUp linear infinite, twinkleOpacity 1.8s ease-in-out infinite;
        }

        .gift-stickers {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .sticker {
            position: absolute;
            font-size: clamp(1.4rem, 4vw, 2.4rem);
            animation: stickerWiggle ease-in-out infinite;
            filter: drop-shadow(0 2px 6px rgba(255,105,180,0.35));
        }
        @keyframes stickerWiggle {
            0%, 100% { transform: rotate(-8deg) scale(1); }
            50%       { transform: rotate(8deg) scale(1.08); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.45; transform: scale(0.92); }
            50%       { opacity: 1; transform: scale(1.12); }
        }
        @keyframes twinkleOpacity {
            0%, 100% { opacity: 0.35; }
            50%       { opacity: 0.95; }
        }

        .gift-heading {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: clamp(1rem, 4vw, 2rem);
            animation: headingBob 2.5s ease-in-out infinite;
        }
        .gift-title {
            display: inline-block;
            font-size: clamp(1.1rem, 4.5vw, 1.75rem);
            font-weight: 700;
            font-style: italic;
            color: #e84393;
            text-shadow: 0 2px 12px rgba(232,67,147,0.35);
        }
        .gift-title-icon {
            display: inline-block;
            margin: 0 0.35em;
            animation: twinkle 2s ease-in-out infinite;
        }
        .gift-title-icon:nth-child(3) { animation-delay: 0.4s; }
        @keyframes headingBob {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-6px); }
        }

        .gift-hint {
            position: relative;
            z-index: 2;
            margin-top: clamp(1.25rem, 5vw, 2rem);
            font-size: clamp(0.95rem, 3.5vw, 1.2rem);
            color: #d63384;
            font-weight: 600;
            text-align: center;
            opacity: 0.9;
        }
        .gift-hint span {
            display: inline-block;
            animation: hintPulse 1.6s ease-in-out infinite;
        }
        .gift-hint span:nth-child(2) { animation-delay: 0.25s; }
        .gift-hint span:nth-child(3) { animation-delay: 0.5s; }
        @keyframes hintPulse {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.15); }
        }

        .gift-orbit {
            position: absolute;
            inset: -45%;
            pointer-events: none;
            animation: orbitSpin 18s linear infinite;
            --orbit-r: clamp(3rem, 14vw, 4.75rem);
        }
        .gift-orbit span {
            position: absolute;
            font-size: clamp(0.85rem, 2.8vw, 1.5rem);
            left: 50%;
            top: 50%;
            margin: -0.55em 0 0 -0.55em;
        }
        .gift-orbit span:nth-child(1) { transform: rotate(0deg) translateY(calc(-1 * var(--orbit-r))); }
        .gift-orbit span:nth-child(2) { transform: rotate(72deg) translateY(calc(-1 * var(--orbit-r))); }
        .gift-orbit span:nth-child(3) { transform: rotate(144deg) translateY(calc(-1 * var(--orbit-r))); }
        .gift-orbit span:nth-child(4) { transform: rotate(216deg) translateY(calc(-1 * var(--orbit-r))); }
        .gift-orbit span:nth-child(5) { transform: rotate(288deg) translateY(calc(-1 * var(--orbit-r))); }
        @keyframes orbitSpin {
            to { transform: rotate(360deg); }
        }
        @keyframes floatUp {
            0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.8; }
            90%  { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.75);
            border-radius: 50%;
            animation: cloudDrift linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        @keyframes cloudDrift {
            0%   { transform: translateX(-120%); }
            100% { transform: translateX(120vw); }
        }

        /* Gift box */
        .gift-wrap {
            position: relative;
            z-index: 2;
            perspective: 600px;
        }
        .gift-box {
            position: relative;
            width: clamp(120px, 30vw, 180px);
            height: clamp(120px, 30vw, 180px);
            transition: transform 0.3s ease;
        }
        .gift-box:hover { transform: scale(1.05); }
        .gift-box.shake { animation: giftShake 0.5s ease; }
        @keyframes giftShake {
            0%, 100% { transform: rotate(0); }
            20%       { transform: rotate(-6deg) scale(1.05); }
            40%       { transform: rotate(6deg) scale(1.05); }
            60%       { transform: rotate(-4deg); }
            80%       { transform: rotate(4deg); }
        }

        .gift-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 72%;
            background: linear-gradient(160deg, #ff6b9d, #e84393);
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(232,67,147,0.45);
        }
        .gift-body::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 18%;
            height: 100%;
            background: #ffd700;
            transform: translateX(-50%);
        }
        .gift-body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 18%;
            background: #ffd700;
            transform: translateY(-50%);
        }

        .gift-lid {
            position: absolute;
            top: 0;
            width: 110%;
            left: -5%;
            height: 32%;
            background: linear-gradient(160deg, #ff85b3, #fd79a8);
            border-radius: 6px 6px 4px 4px;
            box-shadow: 0 4px 12px rgba(232,67,147,0.3);
            transform-origin: bottom center;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease 0.3s;
            z-index: 3;
        }
        .gift-lid::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 16%;
            height: 100%;
            background: #ffd700;
            transform: translateX(-50%);
        }
        .gift-box.opened .gift-lid {
            transform: translateY(-90px) rotateX(70deg);
            opacity: 0;
        }

        .gift-bow {
            position: absolute;
            top: -18%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            transition: transform 0.6s ease, opacity 0.4s ease 0.2s;
        }
        .gift-bow-left, .gift-bow-right {
            position: absolute;
            width: clamp(28px, 7vw, 42px);
            height: clamp(22px, 5.5vw, 32px);
            background: #ffd700;
            border-radius: 50% 50% 0 50%;
            top: 0;
        }
        .gift-bow-left  { left: -30px; transform: rotate(-30deg); }
        .gift-bow-right { right: -30px; transform: rotate(30deg) scaleX(-1); left: auto; }
        .gift-bow-center {
            width: clamp(18px, 4.5vw, 26px);
            height: clamp(18px, 4.5vw, 26px);
            background: #f9ca24;
            border-radius: 50%;
            margin: 0 auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .gift-box.opened .gift-bow {
            transform: translateX(-50%) translateY(-60px) scale(1.3);
            opacity: 0;
        }

        .gift-glow {
            position: absolute;
            inset: -30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,182,193,0.6) 0%, transparent 70%);
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50%       { transform: scale(1.15); opacity: 1; }
        }
        .gift-box.opened .gift-glow {
            animation: burstGlow 0.8s ease forwards;
        }
        @keyframes burstGlow {
            to { transform: scale(3); opacity: 0; }
        }

        /* Confetti canvas */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            z-index: 99;
            pointer-events: none;
        }

        /* ── Main content ── */
        #main-content {
            position: fixed;
            inset: 0;
            opacity: 0;
            transition: opacity 1s ease 0.3s;
        }
        #main-content.show { opacity: 1; }

        canvas#bg-canvas {
            position: absolute;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
        canvas#pinkboard {
            position: absolute;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            touch-action: none;
        }

        .cute-decor {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .decor-item {
            position: absolute;
            font-size: clamp(1rem, 2.5vw, 1.6rem);
            animation: decorFloat ease-in-out infinite;
            opacity: 0.55;
        }
        .decor-item.large {
            font-size: clamp(1.35rem, 3.5vw, 2.1rem);
            opacity: 0.65;
        }
        .decor-item.twinkle {
            animation: decorFloat ease-in-out infinite, twinkleOpacity 2.2s ease-in-out infinite;
        }
        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%       { transform: translateY(-18px) rotate(15deg); }
        }

        .message-charm {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: clamp(0.35rem, 2vw, 0.75rem);
            margin-bottom: 0.65rem;
            font-size: clamp(1.25rem, 4.5vw, 2rem);
            max-width: 100%;
        }
        .message-charm.bottom {
            margin-bottom: 0;
            margin-top: 0.65rem;
        }
        .charm-icon {
            display: inline-block;
            animation: charmBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 11, 130, 0.55));
        }
        .charm-icon:nth-child(2) { animation-delay: 0.2s; }
        .charm-icon:nth-child(3) { animation-delay: 0.4s; }
        .charm-icon:nth-child(4) { animation-delay: 0.6s; }
        .charm-icon:nth-child(5) { animation-delay: 0.8s; }
        @keyframes charmBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50%       { transform: translateY(-5px) scale(1.12); }
        }

        .message-wrap {
            position: absolute;
            top: 72%;
            left: 50%;
            transform: translate(-50%, 0);
            z-index: 2;
            text-align: center;
            width: min(94vw, 42rem);
            padding: 0 0.75rem;
            opacity: 0;
            pointer-events: none;
        }
        .message-wrap.show {
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                       pulse 1.5s infinite 0.8s;
        }

        .header {
            color: #ff4d9e;
            font-size: clamp(1.4rem, 6vw, 3rem);
            font-weight: bold;
            font-style: italic;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 11, 130, 0.9), 0 0 5px rgba(255, 11, 130, 0.7);
            margin-bottom: 0.8rem;
        }
        .text {
            color: #ff0b82;
            font-size: clamp(1.05rem, 2.8vw + 0.35rem, 2.15rem);
            font-weight: bold;
            font-style: italic;
            text-align: center;
            line-height: 1.45;
            text-wrap: balance;
            overflow-wrap: break-word;
            text-shadow: 0 0 15px rgba(255, 11, 130, 0.9), 0 0 5px rgba(255, 11, 130, 0.7);
        }
        .poem {
            margin: 0;
        }
        .poem-line {
            margin: 0;
            color: #ffe8f4;
            font-size: clamp(1.05rem, 2.8vw + 0.35rem, 2.15rem);
            font-weight: bold;
            font-style: italic;
            line-height: 1.55;
            letter-spacing: 0.02em;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.85),
                0 0 1px rgba(74, 0, 40, 0.9),
                0 0 14px rgba(255, 105, 180, 0.45);
        }
        .poem-line + .poem-line {
            margin-top: 0.2em;
        }
        @keyframes popIn {
            from { transform: translate(-50%, 0) scale(0.92); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        @keyframes pulse {
            0%   { transform: translate(-50%, 0) scale(1); }
            50%  { transform: translate(-50%, 0) scale(1.05); }
            100% { transform: translate(-50%, 0) scale(1); }
        }
        @keyframes popInMobile {
            from { transform: translate(-50%, 0) scale(0.94); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        @keyframes pulseMobile {
            0%   { transform: translate(-50%, 0) scale(1); }
            50%  { transform: translate(-50%, 0) scale(1.02); }
            100% { transform: translate(-50%, 0) scale(1); }
        }

        @media (max-width: 768px) {
            .float-item { font-size: clamp(0.95rem, 2.6vw, 1.45rem); }
            .sticker { font-size: clamp(1.05rem, 3.2vw, 1.65rem); }
            .gift-heading { margin-bottom: 0.75rem; }
            .gift-orbit { inset: -38%; --orbit-r: clamp(2.85rem, 18vw, 4rem); }
            .gift-wrap { transform: scale(0.95); }

            .message-wrap {
                top: auto;
                bottom: clamp(2.75rem, 13vh, 4.5rem);
                width: min(96vw, 100%);
                padding: 0 0.65rem;
            }
            .poem {
                margin-top: 0.15rem;
                background: rgba(12, 0, 10, 0.78);
                border: 1px solid rgba(255, 120, 180, 0.4);
                border-radius: 14px;
                padding: 0.7rem 0.85rem;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
            }
            .poem-line {
                color: #fff;
                font-size: clamp(0.95rem, 3.4vw, 1.45rem);
                line-height: 1.48;
                text-shadow:
                    0 1px 3px rgba(0, 0, 0, 0.9),
                    0 0 10px rgba(255, 77, 158, 0.35);
            }
            .message-wrap.show {
                animation: popInMobile 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                           pulseMobile 1.5s infinite 0.8s;
            }
            .message-charm {
                font-size: clamp(1.05rem, 4vw, 1.55rem);
                margin-bottom: 0.5rem;
            }
            .message-charm.bottom { margin-top: 0.5rem; }
            .decor-item { font-size: clamp(0.8rem, 2.1vw, 1.2rem); opacity: 0.5; }
            .decor-item.large { font-size: clamp(0.95rem, 2.6vw, 1.35rem); }
        }

        @media (max-width: 480px) {
            #gift-screen { padding: 0.65rem 0.5rem; }
            .gift-title {
                font-size: clamp(0.9rem, 4.2vw, 1.15rem);
                max-width: 92vw;
                line-height: 1.35;
            }
            .gift-hint {
                font-size: clamp(0.8rem, 3.2vw, 0.95rem);
                margin-top: 0.85rem;
            }
            .gift-orbit { --orbit-r: clamp(2.5rem, 22vw, 3.25rem); }
            .gift-wrap { transform: scale(0.88); }

            .message-wrap {
                bottom: clamp(2.25rem, 11vh, 3.75rem);
            }
            .poem { padding: 0.55rem 0.7rem; }
            .poem-line {
                font-size: clamp(0.875rem, 3.1vw, 1.2rem);
            }
            .message-charm {
                gap: 0.2rem 0.35rem;
                font-size: clamp(0.95rem, 3.8vw, 1.2rem);
            }
            .message-charm .charm-icon:nth-child(n + 4) { display: none; }
            .decor-item { font-size: clamp(0.72rem, 2vw, 1rem); }
        }

        @media (max-width: 360px) {
            .gift-orbit span:nth-child(4),
            .gift-orbit span:nth-child(5) { display: none; }
            .gift-heading { margin-bottom: 0.5rem; }
            .message-wrap {
                bottom: clamp(2rem, 10vh, 3.25rem);
                padding: 0 0.5rem;
            }
            .poem-line { font-size: clamp(0.8rem, 2.9vw, 1rem); }
        }

        @media (max-height: 640px) {
            #gift-screen {
                padding: 0.5rem;
                justify-content: center;
            }
            .gift-heading {
                margin-bottom: 0.35rem;
                animation: none;
            }
            .gift-hint { margin-top: 0.45rem; }
            .gift-orbit { --orbit-r: clamp(2.25rem, 12vw, 2.85rem); inset: -32%; }
            .gift-wrap { transform: scale(0.82); }

            .message-wrap {
                bottom: clamp(1.75rem, 9vh, 3rem);
            }
            .poem-line {
                font-size: clamp(0.78rem, 2.6vw, 0.95rem);
                line-height: 1.4;
            }
            .message-charm {
                margin-bottom: 0.35rem;
                font-size: clamp(0.85rem, 2.8vw, 1.05rem);
            }
            .message-charm.bottom { margin-top: 0.35rem; }
        }

        @media (max-height: 520px) and (orientation: landscape) {
            .gift-heading,
            .gift-hint { display: none; }
            .gift-wrap { transform: scale(0.75); }
            .message-wrap {
                bottom: clamp(1.25rem, 8vh, 2.5rem);
            }
            .message-charm .charm-icon:nth-child(n + 4) { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .float-item,
            .sticker,
            .gift-orbit,
            .decor-item,
            .charm-icon,
            .gift-heading,
            .gift-hint span,
            .gift-title-icon {
                animation: none !important;
            }
        }

        body {
            background: linear-gradient(135deg, #2d0028 0%, #1a001a 50%, #0d0010 100%);
        }
    </style>
</head>
<body>

    <!-- Gift opening screen -->
    <div id="gift-screen">
        <div class="cute-bg" id="cuteBg"></div>
        <div class="gift-stickers" id="giftStickers" aria-hidden="true"></div>
        <div class="gift-heading">
            <div class="gift-title">
                <span class="gift-title-icon">🎀</span>
                Gửi Nhi món quà nhỏ
                <span class="gift-title-icon">💝</span>
            </div>
        </div>
        <div class="gift-wrap">
            <div class="gift-orbit" aria-hidden="true">
                <span>💕</span><span>✨</span><span>🌸</span><span>🎵</span><span>💖</span>
            </div>
            <div class="gift-glow"></div>
            <div class="gift-box" id="giftBox">
                <div class="gift-bow">
                    <div class="gift-bow-left"></div>
                    <div class="gift-bow-center"></div>
                    <div class="gift-bow-right"></div>
                </div>
                <div class="gift-lid"></div>
                <div class="gift-body"></div>
            </div>
        </div>
        <p class="gift-hint" aria-hidden="true">
            <span>🌷</span><span> sắp mở rồi nè </span><span>🎶</span>
        </p>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <!-- Main reveal -->
    <div id="main-content">
        <canvas id="bg-canvas"></canvas>
        <div class="cute-decor" id="cuteDecor"></div>
        <canvas id="pinkboard"></canvas>
        <div class="message-wrap" id="messageWrap">
            <div class="poem">
                <p class="poem-line">Tâm Nhi đáng yêu</p>
                <p class="poem-line">Mong ngày chóng chiều</p>
                <p class="poem-line">Bài vở chóng hết</p>
                <p class="poem-line">Đỡ nhớ em nhiều</p>
            </div>
        </div>
    </div>

    <script>
        // ── Cute floating items on gift screen ──
        (function() {
            const emojis = [
                '✨', '💕', '🌸', '⭐', '🎀', '💖', '🌷', '💗', '🦋', '☁️',
                '🎵', '🎶', '🎤', '💝', '🌺', '🍓', '🧸', '💫', '🌙', '🫧'
            ];
            const bg = document.getElementById('cuteBg');
            const stickers = document.getElementById('giftStickers');
            const stickerSpotsAll = [
                [6, 8], [92, 10], [4, 42], [94, 38], [8, 78], [90, 82], [22, 18], [78, 22]
            ];
            const w = window.innerWidth;
            const h = window.innerHeight;
            const floatCount = w < 480 ? 12 : w < 768 ? 16 : emojis.length;
            const stickerSpots = w < 480 ? stickerSpotsAll.slice(0, 4)
                : w < 768 ? stickerSpotsAll.slice(0, 6) : stickerSpotsAll;
            const cloudCount = h < 640 ? 3 : 5;

            emojis.slice(0, floatCount).forEach((e, i) => {
                const el = document.createElement('span');
                el.className = 'float-item' + (i % 3 === 0 ? ' sparkle' : '');
                el.textContent = e;
                el.style.left = (2 + (i * 4.8) % 96 + Math.random() * 4) + '%';
                el.style.animationDuration = (7 + Math.random() * 11) + 's';
                el.style.animationDelay = (Math.random() * 10) + 's';
                bg.appendChild(el);
            });

            stickerSpots.forEach(([x, y], i) => {
                const el = document.createElement('span');
                el.className = 'sticker';
                el.textContent = emojis[i % emojis.length];
                el.style.left = x + '%';
                el.style.top = y + '%';
                el.style.animationDuration = (2.5 + (i % 4) * 0.4) + 's';
                el.style.animationDelay = (i * 0.15) + 's';
                stickers.appendChild(el);
            });

            for (let i = 0; i < cloudCount; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                const w = 80 + Math.random() * 60;
                cloud.style.cssText = `
                    width:${w}px; height:${w * 0.45}px;
                    top:${10 + i * 22}%;
                    animation-duration:${25 + i * 10}s;
                    animation-delay:${i * 5}s;
                `;
                cloud.style.setProperty('--cw', w * 0.5 + 'px');
                bg.appendChild(cloud);
            }
        })();

        // ── Cute decor on main screen ──
        (function() {
            const items = [
                '💕', '✨', '🌸', '💖', '⭐', '🎀', '🎵', '🎶', '🎤', '🦋',
                '💗', '🌷', '💫', '🌙', '🫧', '💝', '🌺', '🧸', '🍓', '☁️'
            ];
            const decor = document.getElementById('cuteDecor');
            const positionsAll = [
                [8, 12], [88, 8], [5, 55], [92, 48],
                [15, 80], [85, 75], [50, 5], [50, 92],
                [28, 28], [72, 25], [3, 32], [96, 62],
                [12, 42], [88, 88], [45, 88], [55, 12],
                [32, 68], [68, 58], [22, 8], [78, 92]
            ];
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            let positions = positionsAll;
            if (vw < 480 || vh < 640) positions = positionsAll.slice(0, 12);
            if (vw < 360) positions = positionsAll.slice(0, 8);

            positions.forEach(([x, y], i) => {
                const el = document.createElement('span');
                const extra = (i % 5 === 0 && vw >= 480 ? ' large' : '')
                    + (i % 4 === 0 ? ' twinkle' : '');
                el.className = 'decor-item' + extra;
                el.textContent = items[i % items.length];
                el.style.left = x + '%';
                el.style.top  = y + '%';
                el.style.animationDuration = (3 + (i % 6) * 0.45) + 's';
                el.style.animationDelay = (i * 0.22) + 's';
                decor.appendChild(el);
            });
        })();

        // ── Confetti burst ──
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ['#ff6b9d','#ffd700','#a29bfe','#fd79a8','#55efc4','#ffeaa7','#ff85b3'];
            const pieces = [];
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            for (let i = 0; i < 120; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 10;
                pieces.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 4,
                    w: 6 + Math.random() * 8,
                    h: 4 + Math.random() * 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotV: (Math.random() - 0.5) * 12,
                    alpha: 1
                });
            }

            let frame = 0;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                pieces.forEach(p => {
                    p.vy += 0.18;
                    p.x  += p.vx;
                    p.y  += p.vy;
                    p.rot += p.rotV;
                    if (frame > 40) p.alpha -= 0.018;
                    if (p.alpha <= 0) return;
                    alive = true;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });
                frame++;
                if (alive) requestAnimationFrame(draw);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            draw();
        }

        // ── Gift auto open ──
        let opened = false;
        const giftScreen  = document.getElementById('gift-screen');
        const giftBox     = document.getElementById('giftBox');
        const mainContent = document.getElementById('main-content');

        function openGift() {
            if (opened) return;
            opened = true;

            giftBox.classList.add('shake');
            setTimeout(() => giftBox.classList.remove('shake'), 500);

            setTimeout(() => {
                giftBox.classList.add('opened');
                launchConfetti();
            }, 400);

            setTimeout(() => {
                giftScreen.classList.add('hide');
                mainContent.classList.add('show');
                document.getElementById('messageWrap').classList.add('show');
                startMainEffects();
            }, 1200);

            setTimeout(() => giftScreen.remove(), 2200);
        }

        setTimeout(openGift, 1000);

        // ── Main effects (deferred until gift opens) ──
        let effectsStarted = false;
        function startMainEffects() {
            if (effectsStarted) return;
            effectsStarted = true;
            initBgParticles();
            initHeartEffect();
        }

        function initBgParticles() {
            const bgCanvas = document.getElementById('bg-canvas');
            const bgCtx = bgCanvas.getContext('2d');
            bgCanvas.width  = window.innerWidth;
            bgCanvas.height = window.innerHeight;

            const particlesArray = [];
            const colors = ['rgba(255,11,130,', 'rgba(255,105,180,', 'rgba(255,182,193,', 'rgba(162,155,254,'];

            class BgParticle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * bgCanvas.width;
                    this.y = Math.random() * bgCanvas.height;
                    this.size = Math.random() * 3 + 1;
                    this.speedX = Math.random() * 0.4 - 0.2;
                    this.speedY = Math.random() * 0.4 - 0.2;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.alpha = Math.random() * 0.4 + 0.1;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > bgCanvas.width)  this.speedX = -this.speedX;
                    if (this.y < 0 || this.y > bgCanvas.height) this.speedY = -this.speedY;
                }
                draw() {
                    bgCtx.fillStyle = this.color + this.alpha + ')';
                    bgCtx.beginPath();
                    bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    bgCtx.fill();
                }
            }

            for (let i = 0; i < 100; i++) particlesArray.push(new BgParticle());

            (function animate() {
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                particlesArray.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            })();

            window.addEventListener('resize', () => {
                bgCanvas.width  = window.innerWidth;
                bgCanvas.height = window.innerHeight;
            });
        }

        // Heart Effect
        function initHeartEffect() {
            var settings = {
                particles: {
                    length: window.innerWidth < 768 ? 300 : 1200,
                    duration: 3,
                    velocity: 80,
                    effect: -1.3,
                    size: 8,
                    pulseFactor: 0.1
                },
            };

            var Point = (function() {
                function Point(x, y) {
                    this.x = (typeof x !== 'undefined') ? x : 0;
                    this.y = (typeof y !== 'undefined') ? y : 0;
                }
                Point.prototype.clone = function() { return new Point(this.x, this.y); };
                Point.prototype.length = function(length) {
                    if (typeof length == 'undefined') return Math.sqrt(this.x * this.x + this.y * this.y);
                    this.normalize(); this.x *= length; this.y *= length; return this;
                };
                Point.prototype.normalize = function() {
                    var l = this.length(); this.x /= l; this.y /= l; return this;
                };
                return Point;
            })();

            var Particle = (function() {
                function Particle() {
                    this.position = new Point();
                    this.velocity = new Point();
                    this.acceleration = new Point();
                    this.age = 0;
                }
                Particle.prototype.initialize = function(x, y, dx, dy) {
                    this.position.x = x; this.position.y = y;
                    this.velocity.x = dx; this.velocity.y = dy;
                    this.acceleration.x = dx * settings.particles.effect;
                    this.acceleration.y = dy * settings.particles.effect;
                    this.age = 0;
                };
                Particle.prototype.update = function(deltaTime, pulse) {
                    var scale = 1 + Math.sin(Date.now() / 500) * settings.particles.pulseFactor * pulse;
                    this.position.x += this.velocity.x * deltaTime * scale;
                    this.position.y += this.velocity.y * deltaTime * scale;
                    this.velocity.x += this.acceleration.x * deltaTime;
                    this.velocity.y += this.acceleration.y * deltaTime;
                    this.age += deltaTime;
                };
                Particle.prototype.draw = function(context, image) {
                    function ease(t) { return (--t) * t * t + 1; }
                    var size = image.width * ease(this.age / settings.particles.duration);
                    context.globalAlpha = 1 - this.age / settings.particles.duration;
                    context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
                };
                return Particle;
            })();

            var ParticlePool = (function() {
                var particles, firstActive = 0, firstFree = 0, duration = settings.particles.duration;
                function ParticlePool(length) {
                    particles = new Array(length);
                    for (var i = 0; i < particles.length; i++) particles[i] = new Particle();
                }
                ParticlePool.prototype.add = function(x, y, dx, dy) {
                    particles[firstFree].initialize(x, y, dx, dy);
                    firstFree++;
                    if (firstFree == particles.length) firstFree = 0;
                    if (firstActive == firstFree) firstActive++;
                    if (firstActive == particles.length) firstActive = 0;
                };
                ParticlePool.prototype.update = function(deltaTime) {
                    var i, pulse = Math.abs(Math.sin(Date.now() / 500));
                    if (firstActive < firstFree) {
                        for (i = firstActive; i < firstFree; i++) particles[i].update(deltaTime, pulse);
                    }
                    if (firstFree < firstActive) {
                        for (i = firstActive; i < particles.length; i++) particles[i].update(deltaTime, pulse);
                        for (i = 0; i < firstFree; i++) particles[i].update(deltaTime, pulse);
                    }
                    while (particles[firstActive].age >= duration && firstActive != firstFree) {
                        firstActive++;
                        if (firstActive == particles.length) firstActive = 0;
                    }
                };
                ParticlePool.prototype.draw = function(context, image) {
                    var i;
                    if (firstActive < firstFree) {
                        for (i = firstActive; i < firstFree; i++) particles[i].draw(context, image);
                    }
                    if (firstFree < firstActive) {
                        for (i = firstActive; i < particles.length; i++) particles[i].draw(context, image);
                        for (i = 0; i < firstFree; i++) particles[i].draw(context, image);
                    }
                };
                return ParticlePool;
            })();

            (function(canvas) {
                var context = canvas.getContext('2d'),
                    particles = new ParticlePool(settings.particles.length),
                    particleRate = settings.particles.length / settings.particles.duration,
                    time;

                function pointOnHeart(t) {
                    return new Point(
                        160 * Math.pow(Math.sin(t), 3),
                        130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
                    );
                }

                var image = (function() {
                    var c = document.createElement('canvas'), ctx = c.getContext('2d');
                    c.width = settings.particles.size;
                    c.height = settings.particles.size;
                    function to(t) {
                        var p = pointOnHeart(t);
                        p.x = settings.particles.size / 2 + p.x * settings.particles.size / 350;
                        p.y = settings.particles.size / 2 - p.y * settings.particles.size / 350;
                        return p;
                    }
                    ctx.beginPath();
                    var t = -Math.PI, p = to(t);
                    ctx.moveTo(p.x, p.y);
                    while (t < Math.PI) { t += 0.01; p = to(t); ctx.lineTo(p.x, p.y); }
                    ctx.closePath();
                    ctx.fillStyle = '#ff0b82';
                    ctx.fill();
                    var img = new Image();
                    img.src = c.toDataURL();
                    return img;
                })();

                function getHeartLayout() {
                    var w = canvas.width;
                    var h = canvas.height;
                    var cx = w / 2;
                    var cy = h / 2;
                    var scale = 1;
                    if (w < 480 || h < 640) {
                        cy = h * 0.375;
                        scale = 0.84;
                    } else if (w < 768) {
                        cy = h * 0.395;
                        scale = 0.9;
                    }
                    return { cx: cx, cy: cy, scale: scale };
                }

                function render() {
                    requestAnimationFrame(render);
                    var newTime = new Date().getTime() / 1000,
                        deltaTime = newTime - (time || newTime);
                    time = newTime;
                    context.clearRect(0, 0, canvas.width, canvas.height);
                    var layout = getHeartLayout();
                    var amount = particleRate * deltaTime;
                    for (var i = 0; i < amount; i++) {
                        var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
                        pos.x *= layout.scale;
                        pos.y *= layout.scale;
                        var dir = pos.clone().length(settings.particles.velocity);
                        particles.add(layout.cx + pos.x, layout.cy - pos.y, dir.x, -dir.y);
                    }
                    particles.update(deltaTime);
                    particles.draw(context, image);
                }

                function onResize() {
                    canvas.width  = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', onResize);
                onResize();
                render();
            })(document.getElementById('pinkboard'));
        }
    </script>
